<svg width="280" height="64" viewBox="0 0 280 64" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Icon background -->
  <rect width="64" height="64" rx="16" fill="#3B9EE2"/>

  <!-- C arc -->
  <path d="M42 10 C24 10, 14 20, 14 32 C14 44, 24 54, 42 54"
        stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- NFC tap wave 1 (closest) -->
  <path d="M43 22 C47.5 25, 47.5 39, 43 42"
        stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95"/>

  <!-- NFC tap wave 2 (far) -->
  <path d="M47 17 C54 21.5, 54 42.5, 47 47"
        stroke="white" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Tap dot -->
  <circle cx="40" cy="32" r="3" fill="white"/>

  <!-- Wordmark: "C-" in blue, "Transit" in navy -->
  <!-- Using text elements with embedded font fallback -->
  <text x="80" y="38" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="30" letter-spacing="-0.3" fill="#3B9EE2">C-</text>
  <text x="117" y="38" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="30" letter-spacing="-0.3" fill="#1A3F5C">Transit</text>

  <!-- Tagline -->
  <text x="81" y="52" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="9.5" letter-spacing="2.2" fill="#7A9BB5">TAP. RIDE. GO.</text>

</svg>
